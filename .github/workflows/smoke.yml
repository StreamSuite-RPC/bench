name: smoke

# Runs after a release is published. Each runner is a native execution
# environment for one of the binary targets — so this is the real-OS
# verification that the static cross-build actually runs. If any matrix
# leg fails, the release is broken on that platform and we should know.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag to smoke-test (default: latest)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-amd64
            runner: ubuntu-latest
            asset: streamsuite-bench-linux-amd64
            shell: bash
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            asset: streamsuite-bench-linux-arm64
            shell: bash
          - label: darwin-arm64
            runner: macos-latest
            asset: streamsuite-bench-darwin-arm64
            shell: bash
          - label: darwin-amd64
            runner: macos-13
            asset: streamsuite-bench-darwin-amd64
            shell: bash
          - label: windows-amd64
            runner: windows-latest
            asset: streamsuite-bench-windows-amd64.exe
            shell: pwsh

    steps:
      - name: resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            tag=$(curl -sS https://api.github.com/repos/${{ github.repository }}/releases/latest | grep -oE '"tag_name":\s*"[^"]+"' | head -1 | cut -d'"' -f4)
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: download binary (unix)
        if: matrix.shell != 'pwsh'
        run: |
          set -eu
          url="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/${{ matrix.asset }}"
          echo "downloading $url"
          curl -fsSL -o ./streamsuite-bench "$url"
          chmod +x ./streamsuite-bench
          ls -la ./streamsuite-bench

      - name: download binary (windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/${{ matrix.asset }}"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile ./streamsuite-bench.exe
          Get-Item ./streamsuite-bench.exe | Select-Object Name, Length

      - name: --version (unix)
        if: matrix.shell != 'pwsh'
        run: ./streamsuite-bench --version

      - name: --version (windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: .\streamsuite-bench.exe --version

      - name: --help (unix)
        if: matrix.shell != 'pwsh'
        run: ./streamsuite-bench --help

      - name: --help (windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: .\streamsuite-bench.exe --help

      - name: bench against streamsuite (unix)
        if: matrix.shell != 'pwsh'
        run: |
          set -eu
          # 30 calls, no geo (cloud runners can't reach AWS IMDS reliably, and ipinfo
          # adds noise). This validates the full RPC roundtrip + JSON parse.
          ./streamsuite-bench --n 30 --no-geo --json > out.json
          cat out.json
          # Sanity: rpc_p99_ms must be > 0 (calls succeeded), failed must be 0.
          # Use python (preinstalled everywhere) to avoid shell-specific JSON tools.
          python3 - <<'PY'
          import json
          d = json.load(open("out.json"))
          ss = d["streamsuite"]
          assert ss["failed"] == 0, f"failed calls: {ss['failed']}"
          assert ss["rpc_p99_ms"] > 0, f"p99 is zero — calls likely all dropped"
          assert ss["rpc_p99_ms"] < 500, f"p99 absurdly high ({ss['rpc_p99_ms']} ms)"
          print(f"OK: p50={ss['rpc_p50_ms']:.2f}ms p99={ss['rpc_p99_ms']:.2f}ms")
          PY

      - name: bench against streamsuite (windows)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          .\streamsuite-bench.exe --n 30 --no-geo --json | Tee-Object -FilePath out.json | Out-Host
          $d = Get-Content out.json -Raw | ConvertFrom-Json
          $ss = $d.streamsuite
          if ($ss.failed -ne 0) { Write-Error "failed calls: $($ss.failed)"; exit 1 }
          if ($ss.rpc_p99_ms -le 0) { Write-Error "p99 is zero"; exit 1 }
          if ($ss.rpc_p99_ms -ge 500) { Write-Error "p99 absurdly high: $($ss.rpc_p99_ms) ms"; exit 1 }
          Write-Host "OK: p50=$($ss.rpc_p50_ms)ms p99=$($ss.rpc_p99_ms)ms"
