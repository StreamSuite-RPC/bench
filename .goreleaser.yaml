version: 2

project_name: streamsuite-bench

before:
  hooks:
    - go mod tidy

builds:
  - id: streamsuite-bench
    main: ./
    binary: streamsuite-bench
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  # Raw binary — what `curl | sh` installs from. One file, chmod +x, run.
  - id: raw
    formats: ['binary']
    # GoReleaser auto-appends `.exe` on windows when format is `binary`, so
    # the template must NOT include it — otherwise the asset ends up named
    # ...windows-amd64.exe.exe (shipped briefly in v1.0.0).
    name_template: "streamsuite-bench-{{ .Os }}-{{ .Arch }}"

  # Compressed archive — what the "Download" buttons on streamsuite.io/bench
  # link to. tar.gz on unix, zip on windows. Keeps file permissions and
  # plays nicer with mainstream download UX / antivirus scanning.
  - id: archive
    formats: ['tar.gz']
    format_overrides:
      - goos: windows
        formats: ['zip']
    name_template: "streamsuite-bench_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: StreamSuite-RPC
    name: bench
  draft: false
  prerelease: auto
  name_template: "streamsuite-bench {{.Tag}}"
  header: |
    ## streamsuite-bench {{.Tag}}

    Measure your real RPC latency to StreamSuite's BSC node from where your bot lives.
    See the [bench page](https://streamsuite.io/bench) for full methodology and the
    [refund SLA](https://streamsuite.io/legal/refunds).

    ### Install

    ```sh
    curl -sSL https://streamsuite.io/bench/install.sh | sh
    ```

    Or download the binary for your platform below. Verify the SHA256 against
    `checksums.txt`.
