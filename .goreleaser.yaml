version: 2

project_name: streamsuite-bench

before:
  hooks:
    - go mod tidy

builds:
  - id: streamsuite-bench
    main: ./
    binary: streamsuite-bench
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: raw
    formats: ['binary']
    name_template: "streamsuite-bench-{{ .Os }}-{{ .Arch }}{{ if eq .Os \"windows\" }}.exe{{ end }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: StreamSuite-RPC
    name: bench
  draft: false
  prerelease: auto
  name_template: "streamsuite-bench {{.Tag}}"
  header: |
    ## streamsuite-bench {{.Tag}}

    Measure your real RPC latency to StreamSuite's BSC node from where your bot lives.
    See the [bench page](https://streamsuite.io/bench) for full methodology and the
    [refund SLA](https://streamsuite.io/legal/refunds).

    ### Install

    ```sh
    curl -sSL https://streamsuite.io/bench/install.sh | sh
    ```

    Or download the binary for your platform below. Verify the SHA256 against
    `checksums.txt`.
